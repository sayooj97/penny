<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1713;--card:#12241d;--ink:#e6f1ea;--mute:#8aa598;--line:#223a30;--lk:#5fe0b0;--ok:#37c48a;--warn:#f0a63a;--bad:#ff7060;color-scheme:dark}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;padding:16px 16px 130px}

small,.mu{color:var(--mute);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}

.bar{height:9px;border-radius:9px;background:#8a9f9433;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--lk)}.hero .bar i{background:var(--acc)}

.dots{display:flex;gap:3px;margin:14px 0 4px}.dots i{flex:1;height:6px;border-radius:3px;background:#ffffff26}.dots i.on{background:var(--acc)}

input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--lk);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);cursor:pointer;gap:2px}nav button b{font-size:20px}nav .on{color:var(--lk);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--acc);color:var(--ai);font-size:32px;box-shadow:0 8px 20px #0004;cursor:pointer}

.sh{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}.sh h2{margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}.cal .h{text-align:center;font-size:11px;color:var(--mute)}
.d{aspect-ratio:1/1.05;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--bad) var(--h,0%),var(--card));padding:3px 4px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.d.sel{outline:2px solid var(--lk)}.d.td{border-color:var(--lk);font-weight:700}.d.x{visibility:hidden}.d small{font-size:9.5px;line-height:1}.d span{font-size:10px;line-height:1}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.li:last-child{border:0}
.em{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);font-size:20px;flex:none}
.li>div{flex:1;min-width:0}.li>div b{display:block}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;text-align:center}.kp.q{grid-template-columns:repeat(2,1fr);text-align:left}.kp b{font:700 17px var(--d);display:block}
.cols{display:flex;gap:6px;align-items:flex-end;height:96px}.cols div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.cols i{display:block;border-radius:6px 6px 2px 2px;background:var(--lk);min-height:3px;margin-bottom:3px}
.mn{margin-bottom:12px}.nc{background:var(--bg);border-radius:14px;padding:10px;margin-bottom:10px}.nc input,.nc select{margin-bottom:8px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--hero);color:var(--hi);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="toast"></div>
<div id="app"><div class="card" style="text-align:center;padding:40px">Loading SQLite database…</div></div>
<button class="fab" data-a="add" aria-label="Add entry">+</button>
<nav id="nav"></nav>
<div id="sheet" data-a="close"></div>
<script>
const K='penny.v1',GH_KEY='penny.gh',IDB_NAME='PennySQLiteDB',
$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]),
iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},TD=()=>iso(new Date()),
dim=(y,m)=>new Date(y,m+1,0).getDate(),dd=(a,b)=>Math.round((P(b)-P(a))/864e5),
fd=s=>P(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'}),
sh=n=>n>=1e3?(n/1e3).toFixed(n>=1e4?0:1).replace('.0','')+'k':Math.round(n),
plus=n=>iso(new Date(Date.now()+n*864e5));

const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)};

const def=()=>({cur:'INR',salary:0,payday:1,start:TD(),ex:[],goals:[],cats:[['Rent','🏠','need'],['Food','🍜','need'],['Transport','🚌','need'],['Bills','💡','need'],['Health','💊','need'],['Subscriptions','📺','want'],['Shopping','🛍️','want'],['Fun','🎉','want']].map(([name,emoji,kind],i)=>({id:'c'+i,name,emoji,kind,bud:0}))});
let S=def(), SQL=null, db=null, dirty=false;

/* ---- Auto-detect GitHub Pages owner & repo from URL ---- */
function detectRepo(){
  const h=location.hostname, p=location.pathname.split('/').filter(Boolean);
  if(h.endsWith('.github.io')){
    const owner=h.replace('.github.io','');
    const repo=p[0]&&!p[0].includes('.')?p[0]:`${owner}.github.io`;
    return{owner,repo};
  }
  return{owner:'',repo:''};
}

const getGhCfg=()=>{
  const det=detectRepo();
  const base={owner:det.owner,repo:det.repo,branch:'main',path:'penny.sqlite',token:''};
  try{
    const saved=JSON.parse(localStorage.getItem(GH_KEY));
    if(saved)return{...base,...saved,owner:saved.owner||det.owner,repo:saved.repo||det.repo};
  }catch(e){}
  return base;
};
const saveGhCfg=c=>localStorage.setItem(GH_KEY,JSON.stringify(c));

/* ---- One-Click Magic Sync Link Handler (#sync=...) ---- */
function checkMagicLink(){
  if(location.hash.startsWith('#sync=')){
    try{
      const payload=JSON.parse(atob(decodeURIComponent(location.hash.slice(6))));
      if(payload&&payload.token){
        saveGhCfg({...getGhCfg(),...payload});
        history.replaceState(null,'',location.pathname+location.search);
        toast('✓ Device linked! Loading SQLite…');
        return true;
      }
    }catch(e){console.warn('Invalid sync link',e)}
  }
  return false;
}

/* ---- IndexedDB binary cache for SQLite ---- */
const idb={
  open:()=>new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}),
  get:async(k)=>{const d=await idb.open();return new Promise((res,rej)=>{const tx=d.transaction('files','readonly').objectStore('files').get(k);tx.onsuccess=()=>res(tx.result);tx.onerror=()=>rej(tx.error)})},
  set:async(k,v)=>{const d=await idb.open();return new Promise((res,rej)=>{const tx=d.transaction('files','readwrite');tx.objectStore('files').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
};

/* ---- SQLite Schema & Sync Layer ---- */
function initSchema(database){
  database.run(`
    CREATE TABLE IF NOT EXISTS settings (k TEXT PRIMARY KEY, v TEXT);
    CREATE TABLE IF NOT EXISTS categories (id TEXT PRIMARY KEY, name TEXT, emoji TEXT, kind TEXT, bud REAL);
    CREATE TABLE IF NOT EXISTS entries (id TEXT PRIMARY KEY, name TEXT, amt REAL, inc INTEGER, cat TEXT, date TEXT, rec INTEGER);
    CREATE TABLE IF NOT EXISTS goals (id TEXT PRIMARY KEY, emoji TEXT, name TEXT, target REAL, saved REAL, due TEXT);
  `);
}

function dbToState(database){
  initSchema(database);
  const st=def();
  const sRes=database.exec("SELECT k,v FROM settings");
  if(sRes.length){for(const[k,v]of sRes[0].values){if(k=='salary'||k=='payday')st[k]=+v;else st[k]=v}}
  const cRes=database.exec("SELECT id,name,emoji,kind,bud FROM categories");
  if(cRes.length&&cRes[0].values.length)st.cats=cRes[0].values.map(([id,name,emoji,kind,bud])=>({id,name,emoji,kind,bud:+bud||0}));
  const eRes=database.exec("SELECT id,name,amt,inc,cat,date,rec FROM entries");
  st.ex=eRes.length?eRes[0].values.map(([id,name,amt,inc,cat,date,rec])=>({id,name,amt:+amt,inc:+inc,cat,date,rec:!!rec})):[];
  const gRes=database.exec("SELECT id,emoji,name,target,saved,due FROM goals");
  st.goals=gRes.length?gRes[0].values.map(([id,emoji,name,target,saved,due])=>({id,emoji,name,target:+target,saved:+saved,due})):[];
  return st;
}

function stateToDb(database,state){
  initSchema(database);
  database.run("BEGIN TRANSACTION");
  database.run("DELETE FROM settings; DELETE FROM categories; DELETE FROM entries; DELETE FROM goals;");
  const insS=database.prepare("INSERT INTO settings(k,v) VALUES(?,?)");
  for(const k of ['cur','salary','payday','start'])insS.run([k,String(state[k])]);
  insS.free();
  const insC=database.prepare("INSERT INTO categories(id,name,emoji,kind,bud) VALUES(?,?,?,?,?)");
  for(const c of state.cats)insC.run([c.id,c.name,c.emoji,c.kind,c.bud||0]);
  insC.free();
  const insE=database.prepare("INSERT INTO entries(id,name,amt,inc,cat,date,rec) VALUES(?,?,?,?,?,?,?)");
  for(const e of state.ex)insE.run([e.id,e.name,e.amt,e.inc?1:0,e.cat||null,e.date,e.rec?1:0]);
  insE.free();
  const insG=database.prepare("INSERT INTO goals(id,emoji,name,target,saved,due) VALUES(?,?,?,?,?,?)");
  for(const g of state.goals)insG.run([g.id,g.emoji,g.name,g.target,g.saved||0,g.due]);
  insG.free();
  database.run("COMMIT");
}

const u8ToB64=u8=>{let b='';for(let i=0;i<u8.length;i+=0x8000)b+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(b)};
const b64ToU8=b64=>{const bin=atob(b64.replace(/\s/g,''));const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8};

async function pullFromGitHub(silent=false){
  const cfg=getGhCfg();
  const filePath=cfg.path||'penny.sqlite';
  try{
    let u8=null;
    if(cfg.owner&&cfg.repo&&cfg.token){
      const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${filePath}?ref=${cfg.branch||'main'}&t=${Date.now()}`;
      const r=await fetch(url,{headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json'}});
      if(r.ok){const j=await r.json();if(j.content)u8=b64ToU8(j.content)}
    }else{
      const r=await fetch(`./${filePath}?t=${Date.now()}`);
      if(r.ok){const buf=await r.arrayBuffer();if(buf.byteLength>16)u8=new Uint8Array(buf)}
    }
    if(u8){
      db=new SQL.Database(u8);
      S=dbToState(db);
      await idb.set('penny.sqlite',u8);
      dirty=false;
      if(!silent)toast('✓ Synced latest penny.sqlite');
      return true;
    }
  }catch(e){console.warn('GitHub pull skipped:',e)}
  return false;
}

async function pushToGitHub(){
  const cfg=getGhCfg();
  if(!cfg.owner||!cfg.repo||!cfg.token){
    toast('Paste your GitHub token in ⚙️ Settings first');
    ss();
    return;
  }
  toast('Updating penny.sqlite on GitHub…');
  try{
    stateToDb(db,S);
    const u8=db.export();
    await idb.set('penny.sqlite',u8);
    const filePath=cfg.path||'penny.sqlite';
    const branch=cfg.branch||'main';
    const apiUrl=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${filePath}`;
    let sha=undefined;
    const getRes=await fetch(`${apiUrl}?ref=${branch}&t=${Date.now()}`,{
      headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json'}
    });
    if(getRes.ok){const j=await getRes.json();sha=j.sha}
    const putRes=await fetch(apiUrl,{
      method:'PUT',
      headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({
        message:`Update ${filePath} via Penny (${new Date().toISOString().slice(0,16)})`,
        content:u8ToB64(u8),
        branch,
        ...(sha?{sha}:{})
      })
    });
    if(!putRes.ok){
      const err=await putRes.json().catch(()=>({}));
      throw new Error(err.message||putRes.statusText);
    }
    dirty=false;
    render();
    toast('✓ SQLite updated on GitHub!');
  }catch(e){
    toast('Sync failed: '+e.message);
  }
}

const save=()=>{
  dirty=true;
  if(db){
    stateToDb(db,S);
    idb.set('penny.sqlite',db.export()).catch(()=>{});
  }
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
};

const n0=new Date(),ui={tab:'home',y:n0.getFullYear(),m:n0.getMonth(),sel:TD()};
const fmt=n=>{try{return new Intl.NumberFormat(S.cur=='INR'?'en-IN':'en-US',{style:'currency',currency:S.cur,maximumFractionDigits:Math.abs(n)<100&&S.cur!='INR'?2:0}).format(n)}catch(e){return Math.round(n)}};
const catOf=id=>S.cats.find(c=>c.id==id)||{emoji:'❔',name:'Other'};

/* ---- money maths ---- */
const occ=(y,m)=>{const o=[],n=dim(y,m);for(const e of S.ex){const s=P(e.date);if(e.rec){if(y>s.getFullYear()||(y==s.getFullYear()&&m>=s.getMonth()))o.push({e,d:iso(new Date(y,m,Math.min(s.getDate(),n)))})}else if(s.getFullYear()==y&&s.getMonth()==m)o.push({e,d:e.date})}return o};
const stats=(y,m)=>{const o=occ(y,m),by={};let inc=S.salary,F=0,V=0;for(const{e}of o){if(e.inc){inc+=e.amt;continue}e.rec?F+=e.amt:V+=e.amt;by[e.cat]=(by[e.cat]||0)+e.amt}return{o,inc,F,V,by,left:inc-F-V}};
const gneed=g=>{const r=Math.max(0,g.target-g.saved),d=dd(TD(),g.due),late=d<0&&r>0;return{r,d:Math.max(d,0),late,day:r&&!late?r/Math.max(1,d):0}};
const isV=x=>!x.e.rec&&!x.e.inc;
function ctx(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),t=iso(now),n=dim(y,m),dl=n-now.getDate()+1,st=stats(y,m),
tv=st.o.filter(x=>x.d==t&&isV(x)).reduce((a,x)=>a+x.e.amt,0),gd=S.goals.reduce((a,g)=>a+gneed(g).day,0),s0=S.start>iso(new Date(y,m,1))?P(S.start).getDate():1,allow=((st.inc-st.F)*(n-s0+1)/n-(st.V-tv))/dl-gd;
return{now,y,m,t,n,dl,st,tv,gd,allow,s0,lt:allow-tv}}
const streak=()=>{const v=new Set(S.ex.filter(e=>!e.rec&&!e.inc).map(e=>e.date));let s=0,d=new Date();while(iso(d)>=S.start&&!v.has(iso(d))){s++;d.setDate(d.getDate()-1)}return s};

/* ---- views ---- */
const mnav=()=>`<div class="sp mn"><button class="btn" data-a="mm" data-v="-1" aria-label="Previous month">‹</button><h2>${new Date(ui.y,ui.m).toLocaleDateString('en',{month:'long',year:'numeric'})}</h2><button class="btn" data-a="mm" data-v="1" aria-label="Next month">›</button></div>`;
const row=({e,d})=>{const c=catOf(e.cat);return `<div class="li" data-a="edit" data-v="${e.id}"><span class="em">${e.inc?'💰':c.emoji}</span><div><b>${esc(e.name)}</b><small>${e.inc?'Income':c.name}, ${fd(d)}${e.rec?', repeats monthly':''}</small></div><b class="${e.inc?'ok':''}">${e.inc?'+':''}${fmt(e.amt)}</b></div>`};
function home(){const c=ctx(),{st}=c,over=S.cats.filter(k=>k.bud&&(st.by[k.id]||0)>k.bud),
cols=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=iso(d),v=S.ex.filter(e=>!e.rec&&!e.inc&&e.date==k).reduce((a,e)=>a+e.amt,0);return{l:'SMTWTFS'[d.getDay()],v}}),mx=Math.max(1,c.allow,...cols.map(x=>x.v)),
nx=new Date(c.y,c.m+1,1),lim=plus(7),up=[...occ(c.y,c.m),...occ(nx.getFullYear(),nx.getMonth())].filter(x=>x.e.rec&&!x.e.inc&&x.d>=c.t&&x.d<=lim).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,4),
day=c.now.getDate();
return (S.salary?'':`<div class="card"><b>Start with your salary</b><p class="mu" style="margin:4px 0 10px">Enter it once and Penny works out your daily budget.</p><button class="btn p" data-a="set">Set salary</button></div>`)+
`<section class="hero"><small>You can spend today</small><div class="hb num ${c.lt<0?'neg':''}">${fmt(c.lt)}</div><div class="bar"><i style="width:${Math.min(100,c.allow>0?c.tv/c.allow*100:100)}%"></i></div>
<div class="hm"><small>Spent today ${fmt(c.tv)}</small><small>Daily allowance ${fmt(c.allow)}</small></div>
